schema_version: "1"
id: ddd-default
version: "1"
description: "DDD-aware review profile with independent standards, spec, DDD, UI, and custom axes."
checks:
  - id: standards-repository-rules
    axis: standards
    severity: blocker
    blocking: true
    rule: "Changed code follows AGENTS.md, CONTRIBUTING.md, CODING_STANDARDS.md, selected profile, and nearest local conventions."
    evidence: ["AGENTS.md", "nearest repository rules"]
  - id: standards-smell-baseline
    axis: standards
    severity: minor
    blocking: false
    rule: "Use labelled Fowler smell heuristics: mysterious name, duplicated code, feature envy, data clumps, primitive obsession, repeated switches, shotgun surgery, divergent change, speculative generality, message chains, middle man, and refused bequest."
    evidence: ["review diff"]
  - id: spec-confirmed-decisions
    axis: spec
    severity: blocker
    blocking: true
    rule: "Every material behaviour in the diff traces to a confirmed decision or active-slice acceptance scenario."
    evidence: [".ddd/workflow-state.json", "active slice record", "spec source"]
  - id: ddd-slice-boundary
    axis: ddd
    severity: blocker
    blocking: true
    rule: "The diff stays inside the approved active slice and does not implement deferred capabilities."
    evidence: ["active slice", "deferred capabilities", "git diff"]
  - id: ddd-domain-boundary
    axis: ddd
    severity: major
    blocking: true
    rule: "Domain rules and invariants stay technology-neutral; adapters own framework, persistence, transport, and cache details."
    evidence: ["domain design", "codebase design rules", "git diff"]
  - id: ddd-evidence-traceability
    axis: ddd
    severity: major
    blocking: true
    rule: "Each material behaviour has a source decision, acceptance scenario, or explicit user evidence."
    evidence: ["decision register", "acceptance scenarios", "test output"]
  - id: ddd-business-mainline-traceability
    axis: ddd
    severity: major
    blocking: true
    rule: "For human-led projects, material behavior traces back to the confirmed business mainline and its named business change; implementation vocabulary must not replace the business evidence."
    evidence: ["business_artifact", ".ddd/business/mainline.md", "git diff"]
  - id: ddd-vocabulary-consistency
    axis: ddd
    severity: major
    blocking: true
    rule: "Changed behavior, tests, specs, and UI mappings use the canonical glossary term for the confirmed context; aliases and overloaded words are called out."
    evidence: [".ddd/GLOSSARY.md", ".ddd/GLOSSARY-MAP.md", "git diff"]
  - id: ui-library-first
    axis: ui
    severity: major
    blocking: true
    rule: "When the selected UI profile already provides a suitable primitive, use it or record a confirmed reason for a wrapper or replacement."
    evidence: [".ddd/ui-catalog.yaml", ".ddd/ui-plan.yaml", "selected technology profile"]
  - id: ui-composition-boundary
    axis: ui
    severity: major
    blocking: true
    rule: "Page, feature, domain, and library layers have one clear responsibility; repeated state logic belongs in a hook or feature module instead of duplicated JSX."
    evidence: [".ddd/ui-plan.yaml", "git diff"]
  - id: ui-scaffold-contract
    axis: ui
    severity: major
    blocking: true
    rule: "Generated files match the approved scaffold kind, target, naming, and public seam."
    evidence: [".ddd/ui-plan.yaml", ".ddd/scaffold.yaml", "git diff"]
  - id: performance-contract
    axis: performance
    severity: blocker
    blocking: true
    rule: "Persistence or database changes match a confirmed slice performance contract with a pinned adapter_profile, workload budgets, query-plan evidence, and database-specific adapter rules."
    evidence: [".ddd/performance/<slice-id>.yaml", ".ddd/performance/<slice-id>.baseline.json", "selected adapter profile", "git diff"]
  - id: performance-sql-access-path
    axis: performance
    severity: major
    blocking: true
    rule: "SQL changes have an explicit access path, bounded projection, index/order rationale, pagination strategy, transaction and lock scope, timeout, and no unverified N+1 or unbounded list path."
    evidence: [".ddd/performance/<slice-id>.yaml", "query-plan evidence", "git diff"]
  - id: performance-budget-regression
    axis: performance
    severity: major
    blocking: true
    rule: "The measured baseline is reproducible with fixed dataset, seed, concurrency, warmup, duration, profile, and commit metadata; p95/p99, throughput, errors, and declared resource budgets pass."
    evidence: [".ddd/performance/<slice-id>.baseline.json", "performance-loop/scripts/compare_budget.py"]
