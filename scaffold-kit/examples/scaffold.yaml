schema_version: "1"
default_profile: react-antd-pro
backend_generators: &rust_axum_backend_generators
  backend:
    service:
      surface: backend
      requires_ui: false
      requires_database: false
      description: "Axum route seam with no database implementation"
      public_seam: "{{pascal_name}}Router"
      review_checks: [backend-route-seam, cargo-check, no-speculative-storage]
      validation_commands:
        format: cargo fmt --all -- --check
        check: cargo check --workspace --all-targets
        lint: cargo clippy --workspace --all-targets --all-features -- -D warnings
        test: cargo test --workspace
        audit: cargo audit
      files:
        - path: "{{kebab_name}}/mod.rs"
          template: |
            //! {{pascal_name}} backend seam for slice {{slice_id}}.
            use axum::{routing::get, Router};

            pub fn router() -> Router {
                Router::new().route("/{{kebab_name}}", get(health))
            }

            async fn health() -> &'static str {
                "ok"
            }
    repository:
      surface: backend
      requires_ui: false
      requires_database: true
      description: "Database seam that stops before choosing SQL"
      public_seam: "{{pascal_name}}Repository"
      review_checks: [backend-repository-seam, database-profile, cargo-check]
      validation_commands:
        format: cargo fmt --all -- --check
        check: cargo check --workspace --all-targets
        lint: cargo clippy --workspace --all-targets --all-features -- -D warnings
        test: cargo test --workspace
        audit: cargo audit
      files:
        - path: "{{kebab_name}}/repository.rs"
          template: |
            //! {{pascal_name}} repository seam for slice {{slice_id}}.
            //! SQL and migration details remain behind the selected components and database profile.

            pub trait {{pascal_name}}Repository: Send + Sync {}
go_backend_generators: &go_backend_generators
  backend:
    service:
      surface: backend
      requires_ui: false
      requires_database: false
      description: "Echo route seam with no database implementation"
      public_seam: "{{pascal_name}}Handler"
      review_checks: [backend-route-seam, gofmt, go-test, no-speculative-storage]
      validation_commands:
        format: gofmt -l .
        check: go test ./...
        lint: go vet ./...
        test: go test ./...
        audit: govulncheck ./...
      files:
        - path: "{{kebab_name}}/handler.go"
          template: |
            package {{camel_name}}

            // {{pascal_name}}Handler is the transport seam for slice {{slice_id}}.
            type {{pascal_name}}Handler struct{}
    repository:
      surface: backend
      requires_ui: false
      requires_database: true
      description: "Go persistence seam that stops before choosing SQL"
      public_seam: "{{pascal_name}}Repository"
      review_checks: [backend-repository-seam, database-profile, gofmt, go-test]
      validation_commands:
        format: gofmt -l .
        check: go test ./...
        lint: go vet ./...
        test: go test ./...
        audit: govulncheck ./...
      files:
        - path: "{{kebab_name}}/repository.go"
          template: |
            package {{camel_name}}

            // {{pascal_name}}Repository keeps SQL and migration details behind the selected components.
            type {{pascal_name}}Repository interface{}
profiles:
  react-antd-pro:
    version: "1"
    components:
      - kind: language
        id: typescript
        version: project-selected
      - kind: framework
        id: react
        version: project-selected
      - kind: ui_library
        id: antd-pro
        version: project-selected
    aliases:
      c: component
    generators:
      component:
        file-entry-table:
          description: "File-entry list using ProTable"
          required_components: ["ProTable"]
          public_seam: "FileEntryTable"
          review_checks: ["ui-procomponent-first", "ui-request-seam"]
          files:
            - path: "{{kebab_name}}/index.tsx"
              template: |
                import { ProTable } from '@ant-design/pro-components';

                export function {{pascal_name}}() {
                  return (
                    <ProTable
                      rowKey="id"
                      columns={[]}
                      request={async () => ({ data: [], success: true })}
                    />
                  );
                }
  rust-axum-sqlx:
    version: "1"
    surface: backend
    components:
      - kind: language
        id: rust
        version: "1.95"
      - kind: framework
        id: axum
        version: "0.8.9"
      - kind: runtime
        id: tokio
        version: "1.54.1"
      - kind: data_access
        id: sqlx
        version: "0.9.0"
      - kind: migration
        id: sqlx-cli
        version: "0.9.0"
    generators: *rust_axum_backend_generators
  rust-axum-tokio-postgres:
    version: "1"
    surface: backend
    components:
      - kind: language
        id: rust
        version: "1.95"
      - kind: framework
        id: axum
        version: "0.8.9"
      - kind: runtime
        id: tokio
        version: "1.54.1"
      - kind: data_access
        id: tokio-postgres
        version: "0.7.18"
      - kind: migration
        id: refinery
        version: "0.9.2"
    generators: *rust_axum_backend_generators
  rust-axum-toasty:
    version: "1"
    surface: backend
    components:
      - kind: language
        id: rust
        version: "1.95"
      - kind: framework
        id: axum
        version: "0.8.9"
      - kind: runtime
        id: tokio
        version: "1.54.1"
      - kind: data_access
        id: toasty
        version: "0.11.0"
      - kind: migration
        id: refinery
        version: "0.9.2"
    generators: *rust_axum_backend_generators
  go-echo-pgx-sqlc:
    version: "1"
    surface: backend
    components:
      - kind: language
        id: go
        version: project-selected
      - kind: framework
        id: echo
        version: project-selected
      - kind: data_access
        id: pgx
        version: project-selected
      - kind: data_access
        id: sqlc
        version: project-selected
    generators: *go_backend_generators
