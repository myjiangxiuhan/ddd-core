schema_version: "1"
id: sqlserver-2022
engine: sqlserver
version: "2022"
profile_version: "1"
identifier_quote_left: '['
identifier_quote_right: ']'
parameter_style: named_at
pagination_style: lexicographic
capabilities:
  upsert:
    supported: true
    syntax_or_api: "UPDATE then INSERT in an explicit transaction"
    fallback_or_incompatibility: "MERGE requires a separate concurrency review and is not generated by this profile."
  returning:
    supported: true
    syntax_or_api: OUTPUT
    fallback_or_incompatibility: "OUTPUT result shape must be bound to the application seam."
  filtered_indexes:
    supported: true
    syntax_or_api: "CREATE INDEX ... WHERE ..."
    fallback_or_incompatibility: "Filtered predicate and computed-column behavior must be captured in the plan."
  keyset_pagination:
    supported: true
    syntax_or_api: "Lexicographic ordered predicate"
    fallback_or_incompatibility: "Tuple comparison is not generated; every ordering component is expanded."
  plan:
    supported: true
    syntax_or_api: "Actual execution plan plus SET STATISTICS IO, TIME ON"
    fallback_or_incompatibility: "Use an isolated dataset and record isolation and lock scope."
rules:
  require_parameterized: true
  forbid_select_star: true
  preferred_pagination: keyset
  large_dataset_offset: reject
  max_batch_size: 1000
sql_generation:
  list:
    pagination: keyset
    predicate_style: lexicographic
    limit_style: offset_fetch
    plan_command: "SET STATISTICS IO, TIME ON; {sql}"
  upsert:
    strategy: update_insert_transaction
    conflict_reference: inserted
    returning: supported
    concurrency_required: true
    concurrency_options: [serializable, updlock_holdlock]
